<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space War Squadrons</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0914;
        color: #f4d8a8;
        font-family: 'Courier New', Courier, monospace;
        user-select: none;
      }
      #viewport {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #gl-canvas,
      #hud-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud-canvas {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="viewport">
      <canvas id="gl-canvas"></canvas>
      <canvas id="hud-canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

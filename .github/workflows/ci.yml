name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: formal/tla2tools.jar
          key: tlc-jar-v1-${{ hashFiles('scripts/run-formal-check.mjs') }}
      - run: npm ci
      - run: npm run verify:formal

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium --with-deps
          else
            npx playwright install-deps chromium
          fi
      - run: npm run verify:browser
      - name: Upload Playwright screenshots and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots
          path: artifacts/verify/

  tools-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/agent-audio/package-lock.json
      - run: npm --prefix tools/agent-audio ci
      - run: npm --prefix tools/agent-audio test

  tools-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/agent-3d/package-lock.json
      - run: npm --prefix tools/agent-3d ci
      - name: Cache Playwright browsers
        id: pw-cache-3d
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-3d-${{ runner.os }}-${{ hashFiles('tools/agent-3d/package-lock.json') }}
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.pw-cache-3d.outputs.cache-hit }}" != "true" ]; then
            npm --prefix tools/agent-3d exec -- playwright install chromium --with-deps
          else
            npm --prefix tools/agent-3d exec -- playwright install-deps chromium
          fi
      - run: npm --prefix tools/agent-3d test

  tools-daw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/agent-daw/package-lock.json
      - run: npm --prefix tools/agent-daw ci
      - run: npm --prefix tools/agent-daw test
